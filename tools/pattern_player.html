<title>Pattern Player</title>
<style>
  :root{
    --paper:#EDEFEA; --sheet:#F7F8F4; --sunk:#E4E7E0;
    --ink:#191F1C; --muted:#6B756F; --faint:#8B948E;
    --rule:#D3D8CF; --rule-soft:#E2E6DE;
    --cut:#B3261E; --stitch:#2C5A8C; --amber:#8A5E12; --good:#2F6B45;
    --shell:#2C312E; --shell-lit:#3D4440; --shell-dim:#222624;
    --binding:#9AA39B; --web:#8A7F55; --coil:#A8842C; --metal:#8E9691;
    --stage-hi:#F1F3EE; --stage-lo:#C9CFC7;
    --f-label:"Arial Narrow","Helvetica Neue","Liberation Sans Narrow","Nimbus Sans Narrow",Arial,sans-serif;
    --f-body:Georgia,"Iowan Old Style","Times New Roman",serif;
    --f-data:"Cascadia Mono","SFMono-Regular",ui-monospace,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#141917; --sheet:#1B211E; --sunk:#101413;
      --ink:#E5E9E3; --muted:#8F9A94; --faint:#77827C;
      --rule:#2F3833; --rule-soft:#242C28;
      --cut:#E37C6B; --stitch:#7FB2E0; --amber:#D2A445; --good:#6FBF8F;
      --shell:#3A423D; --shell-lit:#4B544E; --shell-dim:#2C332F;
      --binding:#6E7772; --web:#AC9F69; --coil:#D6B356; --metal:#9BA49E;
      --stage-hi:#39413C; --stage-lo:#1A1F1D;
    }
  }
  :root[data-theme="dark"]{
    --paper:#141917; --sheet:#1B211E; --sunk:#101413;
    --ink:#E5E9E3; --muted:#8F9A94; --faint:#77827C;
    --rule:#2F3833; --rule-soft:#242C28;
    --cut:#E37C6B; --stitch:#7FB2E0; --amber:#D2A445; --good:#6FBF8F;
    --shell:#3A423D; --shell-lit:#4B544E; --shell-dim:#2C332F;
    --binding:#6E7772; --web:#AC9F69; --coil:#D6B356; --metal:#9BA49E;
    --stage-hi:#39413C; --stage-lo:#1A1F1D;
  }

  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink);
       font-family:var(--f-body); font-size:16px; line-height:1.6;
       -webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--stitch); outline-offset:2px}

  .lab{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.13em;
       font-size:10px; color:var(--muted)}
  .num{font-family:var(--f-data); font-variant-numeric:tabular-nums}

  /* ---------- masthead ---------- */
  header{border-bottom:2px solid var(--ink); background:var(--paper);
         position:sticky; top:0; z-index:30}
  .mast{max-width:1240px; margin:0 auto; padding:16px 24px 0;
        display:flex; flex-wrap:wrap; gap:14px 26px; align-items:flex-end}
  .brand{font-family:var(--f-label); text-transform:uppercase; font-weight:700;
         letter-spacing:.02em; font-size:26px; line-height:1; margin:0}
  .brand small{display:block; font-size:10px; letter-spacing:.13em; color:var(--muted);
               font-weight:400; margin-top:5px}
  .picker{display:flex; align-items:center; gap:10px; margin-left:auto}
  select{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.08em;
         font-size:13px; font-weight:700; color:var(--ink); background:var(--sheet);
         border:1px solid var(--rule); border-radius:2px; padding:8px 12px; cursor:pointer}
  .stats{max-width:1240px; margin:0 auto; padding:12px 24px 0;
         display:flex; flex-wrap:wrap; gap:0; border-top:1px solid var(--rule-soft)}
  .stat{padding:8px 22px 10px 0; margin-right:22px; border-right:1px solid var(--rule-soft)}
  .stat:last-child{border-right:0}
  .stat b{display:block; font-family:var(--f-data); font-size:14px; font-weight:400;
          font-variant-numeric:tabular-nums; margin-top:2px}
  .flagline{max-width:1240px; margin:0 auto; padding:8px 24px 12px;
            display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.1em;
        font-size:9.5px; padding:3px 8px; border:1px solid var(--rule); border-radius:2px;
        color:var(--muted)}
  .chip.on{color:var(--stitch); border-color:var(--stitch)}
  .chip.warn{color:var(--cut); border-color:var(--cut)}

  /* ---------- shell ---------- */
  .wrap{max-width:1240px; margin:0 auto; padding:0 24px 90px;
        display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:0 40px; align-items:start}
  main{min-width:0}

  /* ---------- viewer ---------- */
  .stage{position:relative; height:420px; margin-top:26px; border:1px solid var(--rule);
         background:radial-gradient(130% 100% at 50% 12%, var(--stage-hi), var(--stage-lo));
         perspective:1600px; display:flex; align-items:center; justify-content:center;
         touch-action:none; cursor:grab; overflow:hidden}
  .stage:active{cursor:grabbing}
  .shadow{position:absolute; left:50%; bottom:52px; width:56%; height:30px;
          transform:translateX(-50%);
          background:radial-gradient(50% 50%, rgba(0,0,0,.32), rgba(0,0,0,0) 70%);
          pointer-events:none}
  .box{position:relative; transform-style:preserve-3d; transition:transform .12s linear}
  .face{position:absolute; overflow:hidden; background:var(--shell);
        border:0 solid var(--binding); backface-visibility:visible}
  .face.lit{background:var(--shell-lit)}
  .face.dim{background:var(--shell-dim)}
  .face.win{background:linear-gradient(135deg, rgba(186,214,226,.42),
              rgba(236,247,250,.14) 48%, rgba(172,200,218,.38))}
  .ftag{position:absolute; left:4px; top:3px; font-family:var(--f-label);
        text-transform:uppercase; letter-spacing:.12em; font-size:9px; color:#fff;
        opacity:.5; pointer-events:none}
  .box.noTags .ftag{display:none}
  .ft{position:absolute}
  .ft-zip{background:var(--coil);
          background-image:repeating-linear-gradient(90deg, rgba(0,0,0,.45) 0 1px, transparent 1px 4px)}
  .ft-web{background:var(--web); opacity:.5}
  .ft-weblap{background:var(--web); opacity:.85}
  .ft-dring{border:2.5px solid var(--metal); border-radius:2px; background:transparent}
  .ft-logo{border:1.5px dashed var(--stitch); background:rgba(44,90,140,.13)}
  .ft-rib{background:var(--shell-dim); box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .ft-pocket{background:rgba(255,255,255,.14); border-top:2px solid var(--binding)}
  .ft-patch{border:2px solid var(--metal); opacity:.7}
  /* A flap that hangs over a zip: drawn as the strip it is, with the free
     edge dashed because that edge is not sewn to anything. */
  .ft-placket{background:rgba(255,255,255,.10); border:1.5px dashed var(--binding)}
  .ft-belt-loop{background:var(--shell-lit); border:1.5px solid var(--shell-dim)}
  .hpart{position:absolute; background:var(--web); border-radius:1px}
  .box.xray .face{opacity:.42}
  .box.xray .ft{opacity:1}

  .ctl{display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center;
       padding:12px 2px 0; font-family:var(--f-label); text-transform:uppercase;
       letter-spacing:.1em; font-size:10px; color:var(--muted)}
  .ctl label{display:flex; align-items:center; gap:8px}
  .ctl input[type=range]{width:120px; accent-color:var(--stitch)}
  .ctl input[type=checkbox]{width:14px; height:14px; accent-color:var(--stitch)}
  .legend{display:flex; flex-wrap:wrap; gap:6px 20px; padding:10px 2px 0}
  .lg{display:flex; align-items:center; gap:8px; font-family:var(--f-label);
      text-transform:uppercase; letter-spacing:.1em; font-size:9.5px; color:var(--muted)}
  .sw{width:20px; height:3px; flex:none}

  /* ---------- tabs ---------- */
  .tabs{display:flex; gap:0; margin-top:34px; border-bottom:2px solid var(--ink);
        overflow-x:auto}
  .tab{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.12em;
       font-size:11px; font-weight:700; color:var(--muted); background:none;
       border:0; border-bottom:3px solid transparent; margin-bottom:-2px;
       padding:10px 16px 9px; cursor:pointer; white-space:nowrap}
  .tab[aria-selected=true]{color:var(--ink); border-bottom-color:var(--cut)}
  .panel{padding-top:26px}
  .panel[hidden]{display:none}

  h2{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.14em;
     font-size:12px; font-weight:700; margin:34px 0 0; padding-bottom:7px;
     border-bottom:1px solid var(--rule)}
  .panel > h2:first-child{margin-top:0}
  p{margin:14px 0 0; max-width:64ch}
  .lede{font-size:17px}

  table{border-collapse:collapse; width:100%; margin-top:16px; font-size:14px}
  th,td{text-align:left; padding:8px 14px 8px 0; border-bottom:1px solid var(--rule-soft);
        vertical-align:top}
  th{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.11em;
     font-size:9.5px; color:var(--muted); font-weight:700;
     border-bottom:1px solid var(--rule); padding-bottom:6px; white-space:nowrap}
  td.d{font-family:var(--f-data); font-variant-numeric:tabular-nums; white-space:nowrap}
  td.sub{color:var(--muted); font-size:13px}
  .scroll{overflow-x:auto}

  .cards{display:grid; gap:0; margin-top:8px}
  .card{border-top:1px solid var(--rule); padding:18px 0;
        display:grid; grid-template-columns:96px 1fr; gap:0 22px}
  .card:last-child{border-bottom:1px solid var(--rule)}
  .card h3{font-family:var(--f-body); font-size:18px; margin:0 0 6px; line-height:1.3}
  .card p{margin:0 0 8px}
  .card p:last-child{margin-bottom:0}
  .kick{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.11em;
        font-size:9.5px; font-weight:700; padding-top:4px}
  .kick::before{content:""; display:block; width:30px; height:3px; margin-bottom:6px}
  .k-note{color:var(--stitch)} .k-note::before{background:var(--stitch)}
  .k-warning{color:var(--cut)} .k-warning::before{background:var(--cut)}
  .k-open{color:var(--amber)} .k-open::before{background:var(--amber)}
  .k-step{color:var(--muted)} .k-step::before{background:var(--muted)}
  .k-step b{display:block; font-family:var(--f-data); font-size:19px; color:var(--ink);
            font-weight:400; letter-spacing:0}
  .stitchnote{font-family:var(--f-data); font-size:12px; color:var(--stitch); margin-top:8px}

  .checks{margin-top:16px}
  .chk{display:grid; grid-template-columns:16px 1fr; gap:0 12px; padding:7px 0;
       border-bottom:1px solid var(--rule-soft); font-size:14px}
  .chk i{font-style:normal; font-family:var(--f-data); font-weight:700}
  .chk.ok i{color:var(--good)} .chk.no i{color:var(--cut)}
  .chk span{color:var(--muted); font-family:var(--f-data); font-size:12px; display:block}

  /* nesting diagram */
  .nest{margin-top:16px; border:1px solid var(--rule); background:var(--sheet); padding:14px}
  .nest svg{display:block; width:100%; height:auto}

  /* ---------- help rail ---------- */
  aside{position:sticky; top:150px; padding-top:26px}
  aside h2{margin-top:0}
  .helplist{list-style:none; margin:0; padding:0}
  .helplist li{border-bottom:1px solid var(--rule-soft)}
  .helpbtn{display:block; width:100%; text-align:left; background:none; border:0;
           padding:11px 0; cursor:pointer; color:var(--ink); font-family:var(--f-body);
           font-size:14px; line-height:1.35}
  .helpbtn:hover{color:var(--stitch)}
  .helpbtn em{display:block; font-family:var(--f-label); text-transform:uppercase;
              letter-spacing:.11em; font-size:9px; color:var(--faint); font-style:normal;
              margin-top:3px}

  /* ---------- reader overlay ---------- */
  .reader{position:fixed; inset:0; z-index:60; background:rgba(10,14,12,.55);
          display:flex; justify-content:flex-end}
  .reader[hidden]{display:none}
  .sheet{background:var(--paper); width:min(760px,100%); height:100%; overflow-y:auto;
         border-left:2px solid var(--ink); padding:0 40px 80px}
  .sheetbar{position:sticky; top:0; background:var(--paper); padding:18px 0 12px;
            border-bottom:1px solid var(--rule); display:flex; gap:16px;
            align-items:baseline; z-index:2}
  .sheetbar h2{flex:1; margin:0; border:0; padding:0; font-size:13px}
  .closebtn{background:none; border:1px solid var(--rule); border-radius:2px;
            font-family:var(--f-label); text-transform:uppercase; letter-spacing:.12em;
            font-size:10px; padding:6px 12px; cursor:pointer; color:var(--ink)}
  .md h1{font-family:var(--f-label); text-transform:uppercase; font-size:30px;
         line-height:1.05; margin:28px 0 0; letter-spacing:.01em}
  .md h2{font-family:var(--f-body); text-transform:none; letter-spacing:0; font-size:22px;
         margin:32px 0 0; padding-bottom:6px; border-bottom:1px solid var(--rule)}
  .md h3{font-family:var(--f-body); font-size:17px; margin:24px 0 0}
  .md h4{font-family:var(--f-label); text-transform:uppercase; letter-spacing:.11em;
         font-size:11px; margin:20px 0 0; color:var(--muted)}
  .md p{margin:13px 0 0}
  .md ul,.md ol{margin:12px 0 0; padding-left:22px}
  .md li{margin:5px 0}
  .md blockquote{margin:18px 0 0; padding:2px 0 2px 18px; border-left:3px solid var(--stitch);
                 color:var(--muted)}
  .md blockquote h3,.md blockquote h4{color:var(--ink); margin-top:6px}
  .md table{font-size:13.5px}
  .md pre{background:var(--sunk); padding:12px 14px; overflow-x:auto; margin:16px 0 0;
          font-family:var(--f-data); font-size:12px; line-height:1.6}
  .md code{font-family:var(--f-data); font-size:.87em; background:var(--rule-soft);
           padding:1px 5px; border-radius:2px}
  .md pre code{background:none; padding:0}
  .md hr{border:0; border-top:1px solid var(--rule); margin:30px 0 0}
  .md .dgm{margin:22px 0 0; padding:16px; background:var(--sheet);
           border:1px solid var(--rule)}
  .md .dgm svg{display:block; width:100%; height:auto; max-width:640px; margin:0 auto}
  .term{background:none; border:0; padding:0 1px; margin:0; cursor:help;
        font:inherit; color:var(--stitch);
        border-bottom:1px dotted var(--stitch)}
  .term:hover{background:var(--stitch); color:var(--sheet)}
  .termshort{font-size:15px; font-weight:600}
  .watchlab{display:block; margin:18px 0 8px}
  .watch{display:flex; flex-direction:column; gap:7px}
  .watchlink{display:flex; align-items:baseline; gap:9px; text-decoration:none;
             color:var(--ink); font-size:13.5px; line-height:1.45;
             border-bottom:1px solid var(--rule); padding-bottom:7px}
  .watchlink:hover{color:var(--stitch)}
  .kindtag{flex:0 0 auto; font-family:var(--f-label); text-transform:uppercase;
           letter-spacing:.11em; font-size:8.5px; padding:2px 6px;
           border:1px solid currentColor; border-radius:2px}
  .k-video{color:var(--cut)}
  .k-photos{color:var(--amber)}
  .k-article{color:var(--muted)}
  .termaka{font-family:var(--f-data); font-size:11px; color:var(--muted);
           margin:-6px 0 12px}
  .stepfig{margin:14px 0 4px; padding:12px; background:var(--sheet);
           border:1px solid var(--rule)}
  .stepfig svg{display:block; width:100%; height:auto; margin:0 auto}
  .stepfig figcaption{margin-top:9px; font-family:var(--f-data); font-size:11px;
                      color:var(--muted); line-height:1.5}
  .seebtn{display:inline-flex; align-items:center; gap:7px; margin-top:10px;
          background:none; border:1px solid var(--stitch); border-radius:2px;
          color:var(--stitch); font-family:var(--f-label); text-transform:uppercase;
          letter-spacing:.11em; font-size:9.5px; padding:6px 11px; cursor:pointer}
  .seebtn:hover{background:var(--stitch); color:var(--sheet)}
  .md a{color:var(--stitch)}
  .md strong{font-weight:700}

  footer{border-top:1px solid var(--rule); margin-top:40px; padding-top:16px;
         font-family:var(--f-label); text-transform:uppercase; letter-spacing:.11em;
         font-size:9.5px; color:var(--faint); display:flex; flex-wrap:wrap; gap:6px 24px}

  @media (max-width:900px){
    .wrap{grid-template-columns:minmax(0,1fr)}
    aside{position:static; border-top:2px solid var(--ink); margin-top:40px}
    .sheet{padding:0 22px 60px}
    .card{grid-template-columns:1fr; gap:8px}
  }
  @media (prefers-reduced-motion:reduce){ .box{transition:none} }
</style>

<header>
  <div class="mast">
    <h1 class="brand">Pattern Player<small>Sewing patterns, declared and derived</small></h1>
    <div class="picker">
      <span class="lab">Pattern</span>
      <select id="pick" aria-label="Choose a pattern"></select>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="flagline" id="flags"></div>
</header>

<div class="wrap">
  <main>
    <div class="stage" id="stage">
      <div class="shadow"></div>
      <div class="box" id="box"></div>
    </div>
    <div class="ctl">
      <label>Turn <input type="range" id="ry" min="-180" max="180" value="-34"></label>
      <label>Tilt <input type="range" id="rx" min="-60" max="30" value="-16"></label>
      <label><input type="checkbox" id="xray"> See inside</label>
      <label><input type="checkbox" id="tags" checked> Face labels</label>
      <span id="scaleNote" class="num" style="margin-left:auto;color:var(--faint)"></span>
    </div>
    <div class="legend" id="legend"></div>

    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="panels"></div>
  </main>

  <aside>
    <h2>Quick help</h2>
    <ul class="helplist" id="helplist"></ul>
    <footer id="prov"></footer>
  </aside>
</div>

<div class="reader" id="reader" hidden>
  <div class="sheet">
    <div class="sheetbar">
      <h2 id="readerTitle" class="lab"></h2>
      <button class="closebtn" id="readerClose">Close</button>
    </div>
    <div class="md" id="readerBody"></div>
  </div>
</div>

<script type="application/json" id="library">__LIBRARY_JSON__</script>
<script>
(function(){
"use strict";
const LIB = JSON.parse(document.getElementById("library").textContent);
const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const n = document.createElement(t);
  if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

/* ---------------- Markdown ----------------------------------------------
   A deliberate subset: exactly what the notes in patterns/ and docs/ use.
   Rendered here rather than in Python so adding a document is a path in a
   spec, not a code change. */
function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, (m,a) => "<code>"+a+"</code>")
    /* Non-greedy, and NOT [^*]+: bold routinely contains an italic run, and a
       character class that excludes the asterisk silently declines to match
       the whole thing -- leaving literal ** in the rendered page. */
    .replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, '<a href="$2" rel="noopener">$1</a>');
}
function cells(line){
  return line.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
}
function markdown(src){
  const lines = src.replace(/\r/g, "").split("\n");
  const out = []; let i = 0;
  const para = [];
  const flush = () => { if (para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para.length = 0; } };
  while (i < lines.length){
    let ln = lines[i];
    let quote = false;
    if (/^>\s?/.test(ln)){ quote = true; }
    if (quote){
      flush();
      const buf = [];
      while (i < lines.length && (/^>\s?/.test(lines[i]) || (buf.length && lines[i].trim() === ""))){
        if (!/^>/.test(lines[i]) && lines[i].trim() === "") { if (!/^>/.test(lines[i+1]||"")) break; }
        buf.push(lines[i].replace(/^>\s?/, "")); i++;
      }
      out.push("<blockquote>"+markdown(buf.join("\n"))+"</blockquote>");
      continue;
    }
    if (/^```/.test(ln)){
      flush();
      const info = ln.slice(3).trim().toLowerCase();
      i++; const buf = [];
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      /* An ```svg fence passes through verbatim. Technique notes need real
         diagrams and the page can fetch nothing, so the diagram has to BE the
         document. These files are repo-local and authored here; nothing from
         outside the repo ever reaches this branch. */
      if (info === "svg") out.push('<figure class="dgm">' + buf.join("\n") + '</figure>');
      else out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>");
      continue;
    }
    const h = /^(#{1,4})\s+(.*)$/.exec(ln);
    if (h){ flush(); const n = h[1].length; out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){ flush(); out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(ln) && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1] || "")){
      flush();
      const head = cells(ln.trim()); i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++].trim()));
      out.push('<div class="scroll"><table><thead><tr>'
        + head.map(c => "<th>"+inline(c)+"</th>").join("")
        + "</tr></thead><tbody>"
        + rows.map(r => "<tr>"+r.map(c => "<td>"+inline(c)+"</td>").join("")+"</tr>").join("")
        + "</tbody></table></div>");
      continue;
    }
    const li = /^\s*([-*+]|\d+\.)\s+(.*)$/.exec(ln);
    if (li){
      flush();
      const ordered = /\d/.test(li[1]);
      const items = [];
      while (i < lines.length){
        const m = /^\s*([-*+]|\d+\.)\s+(.*)$/.exec(lines[i]);
        if (m){ items.push(m[2]); i++; }
        else if (/^\s{2,}\S/.test(lines[i]) && items.length){ items[items.length-1] += " " + lines[i].trim(); i++; }
        else break;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map(t => "<li>"+inline(t)+"</li>").join("") + `</${tag}>`);
      continue;
    }
    if (ln.trim() === ""){ flush(); i++; continue; }
    para.push(ln.trim()); i++;
  }
  flush();
  return out.join("\n");
}

/* ---------------- the 3D model ------------------------------------------
   Every face and every feature is positioned from the package's model3d at a
   computed px-per-inch. No pattern has rendering code of its own: a new spec
   previews the moment it is packaged. */
const FACE = {
  front:  { w:"w", h:"h", axis:"d", sign:1,  tone:"lit"  },
  back:   { w:"w", h:"h", axis:"d", sign:1,  tone:""     },
  left:   { w:"d", h:"h", axis:"w", sign:1,  tone:"dim"  },
  right:  { w:"d", h:"h", axis:"w", sign:1,  tone:""     },
  top:    { w:"w", h:"d", axis:"h", sign:1,  tone:"lit"  },
  bottom: { w:"w", h:"d", axis:"h", sign:1,  tone:"dim"  }
};
const XFORM = {
  front:  (W,H,D) => `translateZ(${D/2}px)`,
  back:   (W,H,D) => `rotateY(180deg) translateZ(${D/2}px)`,
  left:   (W,H,D) => `rotateY(-90deg) translateZ(${W/2}px)`,
  right:  (W,H,D) => `rotateY(90deg) translateZ(${W/2}px)`,
  top:    (W,H,D) => `rotateX(90deg) translateZ(${H/2}px)`,
  bottom: (W,H,D) => `rotateX(-90deg) translateZ(${H/2}px)`
};
/* Each face is laid out as its own div and then rotated into place, so its
   local axes do not all run the same way round the bag. Two of them disagree
   with "measured from the front", and a band drawn on the wrong side of the
   depth is the one error in here that would look plausible. */
const FLIP_V = { top:true },  FLIP_U = { left:true };

function depthPos(face, across, width, D){
  if (face === "top")    return { along:"v", pos: D - across - width };
  if (face === "bottom") return { along:"v", pos: across };
  if (face === "left")   return { along:"u", pos: D - across - width };
  return { along:"u", pos: across };            /* right */
}

let scale = 20;
function build(pkg){
  const box = $("#box");
  box.innerHTML = "";
  const m = pkg.model3d;
  const inch = k => pkg.finished[k].in;
  const W0 = inch("w"), H0 = inch("h"), D0 = inch("d");
  const stage = $("#stage").getBoundingClientRect();
  scale = Math.min((stage.width * 0.62) / Math.max(W0, D0),
                   (stage.height * 0.62) / Math.max(H0, D0));
  const W = W0*scale, H = H0*scale, D = D0*scale;
  box.style.width = W + "px";
  box.style.height = H + "px";
  $("#scaleNote").textContent = scale.toFixed(1) + " px per inch — drawn from the cut list";

  const bindPx = m.binding_show.in * scale;
  const rPx = (m.corner_radius ? m.corner_radius.in : 0) * scale;

  for (const name of Object.keys(FACE)){
    const cfg = FACE[name];
    const fw = m.faces[name].w.in * scale, fh = m.faces[name].h.in * scale;
    const f = el("div", "face " + (cfg.tone || "") + (pkg.flags.has_windows &&
              (name === "front" || name === "back") ? " win" : ""));
    f.style.width = fw + "px";
    f.style.height = fh + "px";
    f.style.left = (W - fw)/2 + "px";
    f.style.top  = (H - fh)/2 + "px";
    f.style.transform = XFORM[name](W, H, D);
    f.style.borderWidth = bindPx + "px";
    /* The bag is an EXTRUSION: two flat panels and a gusset band wrapping
       their outline. A rounded corner is a curve in that outline, so only the
       panels get a radius -- the band has no crease there and runs straight
       through. Rounding the side faces as well would fillet the wrong edges
       and turn an extruded profile into a rounded box. */
    if (rPx && (name === "front" || name === "back")){
      f.style.borderBottomLeftRadius = rPx + "px";
      f.style.borderBottomRightRadius = rPx + "px";
    }
    /* ...and the band's flat faces have to stop where the curve starts. */
    if (rPx && (name === "left" || name === "right")){
      f.style.height = (fh - rPx) + "px";
      f.style.top = "0px";
    }
    if (rPx && name === "bottom"){
      f.style.width = (fw - 2*rPx) + "px";
      f.style.left = (W - (fw - 2*rPx))/2 + "px";
    }
    f.dataset.face = name;
    f.appendChild(el("span", "ftag", name));
    box.appendChild(f);
  }
  /* CSS cannot bend a face, so the curved run of the gusset is built as a
     ribbon of flat facets following the arc. It is the same band -- one piece
     of fabric, no creases, no seams -- and faceting it is purely how a box
     model has to draw a curve. Six per quarter turn is under 0.2% short of the
     true arc length, which is finer than the binding is wide. */
  const FACETS = 6;
  if (rPx){
    const seg = [];
    const q = Math.PI / 2 / FACETS;
    for (const [cx, cy, a0] of [[W/2 - rPx, H/2 - rPx, 0],            // bottom right
                                [-W/2 + rPx, H/2 - rPx, Math.PI/2]]){ // bottom left
      for (let k = 0; k < FACETS; k++){
        const am = a0 + (k + 0.5) * q;
        const d = rPx * Math.cos(q/2);
        seg.push({ x: cx + d*Math.cos(am), y: cy + d*Math.sin(am),
                   len: 2*rPx*Math.sin(q/2), th: am + Math.PI/2 });
      }
    }
    for (const s of seg){
      const f = el("div", "face dim");
      f.style.width = s.len + "px";
      f.style.height = D + "px";
      f.style.left = (W - s.len)/2 + "px";
      f.style.top = (H - D)/2 + "px";
      f.style.borderWidth = bindPx + "px 0";
      f.style.transform = `translate3d(${s.x}px, ${s.y}px, 0) `
                        + `rotateZ(${s.th * 180/Math.PI}deg) rotateX(90deg)`;
      f.dataset.face = "curve";
      box.appendChild(f);
    }
  }

  const faceOf = n => box.querySelector(`.face[data-face="${n}"]`);

  const place = (face, u, v, w, h, cls, title) => {
    const host = faceOf(face); if (!host) return;
    const fw = m.faces[face].w.in, fh = m.faces[face].h.in;
    let U = FLIP_U[face] ? fw - u - w : u;
    let V = FLIP_V[face] ? fh - v - h : v;
    const d = el("div", "ft " + cls);
    d.style.left = (U*scale - bindPx) + "px";
    d.style.top  = (V*scale - bindPx) + "px";
    d.style.width = w*scale + "px";
    d.style.height = h*scale + "px";
    if (title) d.title = title;
    host.appendChild(d);
    return d;
  };

  for (const ft of m.features){
    if (ft.kind === "webbing" && ft.ring){
      for (const face of ["top","right","bottom","left"]){
        const fw = m.faces[face].w.in, fh = m.faces[face].h.in;
        const p = depthPos(face, ft.across_depth_in, ft.width_in, D0);
        if (p.along === "v") place(face, 0, p.pos, fw, ft.width_in, "ft-web", ft.label);
        else                 place(face, p.pos, 0, ft.width_in, fh, "ft-web", ft.label);
      }
      if (ft.overlap_in){
        const fw = m.faces.top.w.in;
        const p = depthPos("top", ft.across_depth_in, ft.width_in, D0);
        place("top", (fw - ft.overlap_in)/2, p.pos, ft.overlap_in, ft.width_in,
              "ft-weblap", "chassis overlap — the only joint");
      }
      continue;
    }
    if (ft.kind === "zip"){ place(ft.face, ft.u, ft.v, ft.w, ft.h, "ft-zip", ft.label); continue; }
    if (ft.kind === "dring"){
      place(ft.face, ft.u - 0.625, ft.v - 0.30, 1.25, 0.60, "ft-dring", ft.label); continue;
    }
    if (ft.kind === "patch"){ place(ft.face, ft.u - .5, ft.v - .5, 1, 1, "ft-patch", ft.label); continue; }
    if (ft.kind === "rib"){
      place(ft.face, ft.u, 0, ft.w, m.faces[ft.face].h.in, "ft-rib", ft.label); continue;
    }
    if (ft.kind === "handle"){
      const c = Math.abs(ft.to - ft.from);
      const L = (pkg.geometry.handle ? pkg.geometry.handle.in : c + 2) - 2;
      const rise = L > c ? c * Math.sqrt(3*(L/c - 1)/8) : 0.5;
      const p = depthPos("top", (D0 - 1)/2, 1, D0);
      const wpx = 0.9*scale, risePx = rise*scale;
      const zTop = H/2 + risePx;
      const mk = (w, h, tf, t) => { const d = el("div","hpart"); d.style.width = w+"px";
        d.style.height = h+"px"; d.style.left = (W - w)/2 + "px";
        d.style.top = (H - h)/2 + "px"; d.style.transform = tf; d.title = t || "";
        box.appendChild(d); };
      const mid = (ft.from + ft.to)/2 - W0/2;
      mk(c*scale, wpx, `translate3d(${mid*scale}px, ${-zTop}px, 0) rotateX(90deg)`,
         `${pkg.geometry.handle ? pkg.geometry.handle.text : ""} grab handle`);
      for (const end of [ft.from, ft.to]){
        mk(wpx, risePx, `translate3d(${(end - W0/2)*scale}px, ${-(H/2 + risePx/2)}px, 0)`);
      }
      continue;
    }
    if (ft.face) place(ft.face, ft.u, ft.v, ft.w || 1, ft.h || 1, "ft-" + ft.kind, ft.label);
  }
}

/* ---------------- rotation ---------------------------------------------- */
let rx = -16, ry = -34;
function apply(){
  $("#box").style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  $("#rx").value = rx; $("#ry").value = ry;
}
(function drag(){
  const st = $("#stage"); let on = false, px = 0, py = 0;
  st.addEventListener("pointerdown", e => { on = true; px = e.clientX; py = e.clientY;
    st.setPointerCapture(e.pointerId); });
  st.addEventListener("pointermove", e => { if (!on) return;
    ry += (e.clientX - px) * 0.55; rx -= (e.clientY - py) * 0.45;
    rx = Math.max(-60, Math.min(30, rx));
    ry = ((ry + 180) % 360 + 360) % 360 - 180;
    px = e.clientX; py = e.clientY; apply(); });
  const stop = () => { on = false; };
  st.addEventListener("pointerup", stop); st.addEventListener("pointercancel", stop);
})();
$("#rx").addEventListener("input", e => { rx = +e.target.value; apply(); });
$("#ry").addEventListener("input", e => { ry = +e.target.value; apply(); });
$("#xray").addEventListener("change", e => $("#box").classList.toggle("xray", e.target.checked));
$("#tags").addEventListener("change", e => $("#box").classList.toggle("noTags", !e.target.checked));

/* ---------------- panels ------------------------------------------------- */
const TABS = ["Overview", "Comfort", "Materials", "Cut list", "Assembly", "Glossary", "Checks"];

function tableOf(head, rows){
  const wrap = el("div", "scroll"), t = el("table");
  const th = el("thead"), tr = el("tr");
  head.forEach(h => tr.appendChild(el("th", null, h)));
  th.appendChild(tr); t.appendChild(th);
  const tb = el("tbody");
  rows.forEach(r => {
    const x = el("tr");
    r.forEach(c => {
      const td = el("td", c && c.cls || null);
      /* A cell may be a live node -- the glossary puts a button in one. */
      if (c && c.node) td.appendChild(c.node);
      else td.textContent = (c && c.t !== undefined) ? c.t : (c == null ? "" : c);
      x.appendChild(td);
    });
    tb.appendChild(x);
  });
  t.appendChild(tb); wrap.appendChild(t); return wrap;
}
/* ---- step figures ------------------------------------------------------
   A step's figure is DECLARED, never drawn per bag. Two forms:

     {doc, id}            embed a technique diagram by its svg id. Those are
                          deliberately dimensionless -- one drawing serves
                          every bag, and it lives in exactly one file.
     {kind, ...}          generate from THIS bag's geometry. Anything with a
                          number in it has to be generated: a hand-drawn
                          "2 5/16 strip" is wrong the first time the bag is
                          resized, and nothing would catch it.
------------------------------------------------------------------------ */
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, at, txt){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in at) if (at[k] !== undefined && at[k] !== null) n.setAttribute(k, at[k]);
  if (txt != null) n.textContent = txt;
  return n;
}
function fig(vb, label){
  const s = svgEl("svg", {viewBox: vb, role: "img", "aria-label": label});
  s.add = (tag, at, txt) => { const n = svgEl(tag, at, txt); s.appendChild(n); return n; };
  return s;
}
/* A dimension line with its figure, used everywhere below. */
function dim1(s, x1, y, x2, txt, col){
  col = col || "var(--muted)";
  s.add("path", {d:`M${x1},${y} H${x2}`, stroke:col, "stroke-width":1});
  s.add("path", {d:`M${x1},${y-4} v8 M${x2},${y-4} v8`, stroke:col, "stroke-width":1});
  s.add("text", {x:(x1+x2)/2, y:y-7, "text-anchor":"middle",
                 "font-family":"var(--f-data)", "font-size":11, fill:col}, txt);
}
function vdim(s, x, y1, y2, txt, col){
  col = col || "var(--muted)";
  s.add("path", {d:`M${x},${y1} V${y2}`, stroke:col, "stroke-width":1});
  s.add("path", {d:`M${x-4},${y1} h8 M${x-4},${y2} h8`, stroke:col, "stroke-width":1});
  s.add("text", {x:x+6, y:(y1+y2)/2+4, "font-family":"var(--f-data)",
                 "font-size":11, fill:col}, txt);
}
function caption(s, x, y, txt, col){
  s.add("text", {x, y, "font-family":"var(--f-label)", "font-size":10.5,
                 "letter-spacing":1.5, fill:col || "var(--muted)"}, txt);
}

/* --- the gusset ring, at the stage the step is actually at -------------
   Four steps touch the ring and they are four different moments. Drawing the
   same picture on all of them is worse than drawing nothing: it teaches the
   reader that the figure is decoration. `stage` says which moment:

     cut     two flat pieces, nothing joined, the gusset still overlong
     fit     clipped round a panel, with the trim mark on it
     join1   the first lap closed, still a strip
     join2   closed into a loop, both joins at the top corners
*/
function figRing(p, spec){
  const g = p.geometry, G = k => g[k].in;
  const zc = G("zip_cut"), gc = G("gusset_cut"), gl = G("gusset_cut_long") || gc,
        lap = G("lap");
  const stage = spec.stage || "fit";
  const W = 660, PAD = 26;

  if (stage === "join2"){
    /* Closed: draw it as the loop it now is, so "second lap join" cannot be
       mistaken for the first. */
    const s = fig(`0 0 ${W} 300`,
      `The ring closed into a loop: the zipper panel across the top and the `
      + `gusset round the other three sides, with both lap joins at the top corners.`);
    caption(s, PAD, 24, "THE RING, CLOSED — BOTH JOINS AT THE TOP CORNERS");
    const bw = 420, bh = 190, X = (W - bw) / 2, Y = 56, t = 22;
    s.add("rect", {x:X, y:Y, width:bw, height:bh, fill:"none",
                   stroke:"var(--shell-lit)", "stroke-width":t});
    s.add("rect", {x:X - t/2, y:Y - t/2, width:bw + t, height:t,
                   fill:"var(--shell)"});
    s.add("rect", {x:X - t/2, y:Y - 4, width:bw + t, height:8, fill:"var(--coil)"});
    s.add("text", {x:X + bw/2, y:Y - 18, "text-anchor":"middle",
                   "font-family":"var(--f-data)", "font-size":12,
                   fill:"var(--ink)"}, "zipper panel");
    s.add("text", {x:X + bw/2, y:Y + bh + 34, "text-anchor":"middle",
                   "font-family":"var(--f-data)", "font-size":12,
                   fill:"var(--ink)"}, "gusset");
    [[X - t/2, "join 1"], [X + bw + t/2, "join 2 — this one"]].forEach(([jx, lbl], i) => {
      const on = i === 1;
      s.add("rect", {x:jx - 9, y:Y - t/2 - 6, width:18, height:t + 26,
                     fill:on ? "var(--cut)" : "var(--muted)", opacity:on ? .5 : .22});
      s.add("text", {x:jx, y:Y + t + 40, "text-anchor":"middle",
                     "font-family":"var(--f-data)", "font-size":11,
                     fill:on ? "var(--cut)" : "var(--muted)"}, lbl);
    });
    s.add("text", {x:PAD, y:288, "font-family":"var(--f-data)", "font-size":11,
                   fill:"var(--muted)"},
          `both joins land where the binding will mitre — hand-wheel them. `
          + `Closed, the ring measures ${g.ring.text}.`);
    return s;
  }

  /* Open: the pieces laid out end to end, at the length this stage has. */
  const glen = stage === "cut" ? gl : gc;
  const S = (W - 2*PAD) / (zc + gl);
  const y = 100, hh = 34, zx = PAD, gx = PAD + zc*S;
  const LABEL = {cut: "CUT FLAT — NOTHING JOINED YET",
                 fit: "FITTED AND TRIMMED — STILL OPEN",
                 join1: "FIRST LAP CLOSED — STILL A STRIP"}[stage];
  const s = fig(`0 0 ${W} 235`,
    `The zipper panel and the gusset laid flat, at the "${stage}" stage of the build.`);
  caption(s, PAD, 24, LABEL);

  s.add("rect", {x:zx, y, width:zc*S, height:hh, fill:"var(--shell)", opacity:.9});
  s.add("rect", {x:zx, y:y+hh/2-4, width:zc*S, height:8, fill:"var(--coil)"});
  s.add("text", {x:zx + zc*S/2, y:y+hh+18, "text-anchor":"middle",
                 "font-family":"var(--f-data)", "font-size":12,
                 fill:"var(--ink)"}, "zipper panel");
  s.add("rect", {x:gx, y, width:glen*S, height:hh,
                 fill:"var(--shell-lit)", opacity:.9});
  s.add("text", {x:gx + glen*S/2, y:y+hh+18, "text-anchor":"middle",
                 "font-family":"var(--f-data)", "font-size":12,
                 fill:"var(--ink)"}, "gusset");

  if (stage === "cut"){
    /* The offcut, shown as the thing you will trim away rather than as part
       of the piece -- that is the whole point of the step. */
    s.add("rect", {x:gx + gc*S, y, width:(gl - gc)*S, height:hh,
                   fill:"var(--cut)", opacity:.22});
    s.add("path", {d:`M${gx + gc*S},${y-8} v${hh+16}`, stroke:"var(--cut)",
                   "stroke-width":1.6, "stroke-dasharray":"6 4"});
    s.add("text", {x:gx + gc*S + (gl-gc)*S/2, y:y-14, "text-anchor":"middle",
                   "font-family":"var(--f-data)", "font-size":11,
                   fill:"var(--cut)"}, "trimmed later");
    dim1(s, gx, y+hh+46, gx+gl*S, `cut ${g.gusset_cut_long.text}`, "var(--stitch)");
    dim1(s, gx, y+hh+76, gx+gc*S, `finishes ${g.gusset_cut.text}`, "var(--good)");
    s.add("text", {x:PAD, y:224, "font-family":"var(--f-data)", "font-size":11,
                   fill:"var(--muted)"},
          "cut long, fit, then trim — the ring's true length depends on the lap "
          + "you achieve and on how hard the binding pulls");
    return s;
  }

  if (stage === "fit"){
    s.add("path", {d:`M${gx + gc*S},${y-8} v${hh+16}`, stroke:"var(--cut)",
                   "stroke-width":2});
    s.add("text", {x:gx + gc*S, y:y-14, "text-anchor":"middle",
                   "font-family":"var(--f-data)", "font-size":11,
                   fill:"var(--cut)"}, "trim here");
    dim1(s, gx, y+hh+46, gx+gc*S, `gusset to ${g.gusset_cut.text}`, "var(--stitch)");
    dim1(s, zx, y+hh+76, gx+gc*S,
         `plus ${g.lap.text} at each end → ring closes at ${g.ring.text}`, "var(--good)");
    s.add("text", {x:PAD, y:224, "font-family":"var(--f-data)", "font-size":11,
                   fill:"var(--muted)"},
          `two strips lapped by ${g.lap.text} cover their combined length LESS `
          + `${g.lap.text}, so only the zipper panel carries that allowance`);
    return s;
  }

  /* join1: one lap actually closed, and the other end still loose. */
  const lx = gx - lap*S;
  s.add("rect", {x:lx, y:y-6, width:lap*S, height:hh+12,
                 fill:"var(--cut)", opacity:.45});
  s.add("path", {d:`M${lx},${y-6} v${hh+12} M${lx+lap*S},${y-6} v${hh+12}`,
                 stroke:"var(--cut)", "stroke-width":1.6});
  s.add("text", {x:lx + lap*S/2, y:y-14, "text-anchor":"middle",
                 "font-family":"var(--f-data)", "font-size":11,
                 fill:"var(--cut)"}, "join 1 — this one");
  [lx + lap*S*0.3, lx + lap*S*0.7].forEach(x =>
    s.add("circle", {cx:x, cy:y+hh/2, r:3.4, fill:"var(--stitch)"}));
  s.add("path", {d:`M${PAD + (zc+gc)*S - lap*S},${y-6} v${hh+12}`,
                 stroke:"var(--muted)", "stroke-width":1.4, "stroke-dasharray":"5 4"});
  s.add("text", {x:PAD + (zc+gc)*S - lap*S, y:y+hh+42, "text-anchor":"middle",
                 "font-family":"var(--f-data)", "font-size":11,
                 fill:"var(--muted)"}, "join 2 — still open");
  s.add("text", {x:PAD, y:224, "font-family":"var(--f-data)", "font-size":11,
                 fill:"var(--muted)"},
        `lap ${g.lap.text} and topstitch two rows. Leave the other end loose — `
        + "the ring is easier to fit to the panel while it is still a strip.");
  return s;
}

/* --- the gusset with its ring anchors, topstitched --------------------
   NOT a box-X. This step's own stitch line is "straight, both long edges",
   and the figure used to show a box-X, which is the tack used on the D-ring
   TAB two steps later. A drawing that contradicts its step is worse than no
   drawing. */
function figAnchors(p, spec){
  const g = p.geometry, G = k => g[k].in;
  const gw = G("gusset_w"), gc = G("gusset_cut"),
        aw = G("ring_anchor_len"), n = spec.count || 2;
  const W = 660, PAD = 34, S = (W - 2*PAD) / gc;
  const y = 74, hh = Math.max(gw * S, 42);
  const s = fig(`0 0 ${W} ${y + hh + 96}`,
    `The gusset laid flat inside face up, with a ${g.ring_anchor_len.text} anchor `
    + `strip across it at each D-ring position, topstitched along both long edges.`);
  caption(s, PAD, 24, "GUSSET, INSIDE FACE UP — DO THIS WHILE IT IS FLAT");
  s.add("rect", {x:PAD, y, width:gc*S, height:hh, fill:"var(--shell-lit)", opacity:.85});
  s.add("text", {x:PAD + 8, y:y + hh + 20, "font-family":"var(--f-data)",
                 "font-size":11, fill:"var(--muted)"}, "gusset interior");
  /* One anchor near each end, which is where the upper corners land. */
  for (let i = 0; i < n; i++){
    const cx = PAD + gc*S * (i === 0 ? 0.13 : 0.87);
    const x = cx - aw*S/2;
    s.add("rect", {x, y:y-5, width:aw*S, height:hh+10,
                   fill:"var(--web)", "fill-opacity":.55,
                   stroke:"var(--web)", "stroke-width":1.4});
    /* both LONG edges -- the strip runs the gusset's full width, so its long
       edges are the two that run across the picture */
    [y + 5, y + hh - 5].forEach(ly =>
      s.add("path", {d:`M${x+3},${ly} H${x + aw*S - 3}`, stroke:"var(--stitch)",
                     "stroke-width":2, "stroke-dasharray":"7 4"}));
    s.add("text", {x:cx, y:y-14, "text-anchor":"middle",
                   "font-family":"var(--f-data)", "font-size":11,
                   fill:"var(--ink)"}, `ring ${i+1}`);
  }
  s.add("text", {x:PAD, y:y+hh+46, "font-family":"var(--f-data)", "font-size":11,
                 fill:"var(--stitch)"},
        "two straight runs per strip, along its LONG edges — no box-X here");
  s.add("text", {x:PAD, y:y+hh+68, "font-family":"var(--f-data)", "font-size":11,
                 fill:"var(--muted)"},
        `each strip runs the gusset's full ${g.gusset_w.text} width, so both ends `
        + "finish flush with the panel edges and the bindings catch them");
  return s;
}

/* --- which faces carry embroidery, and therefore get hooped separately -- */
function figLogos(p){
  const m = p.model3d;
  const logos = (m.features || []).filter(f => f.kind === "logo");
  if (!logos.length) return null;
  const W = 660, PAD = 20, gap = 14;
  const cw = (W - 2*PAD - gap*(logos.length - 1)) / logos.length;
  const s = fig(`0 0 ${W} 210`,
    `The ${logos.length} faces of this bag that carry embroidery, each hooped `
    + `and stitched flat before anything is assembled.`);
  caption(s, PAD, 22, `${logos.length} SEPARATE HOOPINGS — ALL BEFORE ASSEMBLY`);
  logos.forEach((f, i) => {
    const face = m.faces[f.face] || {w:{in:1}, h:{in:1}};
    const fw = face.w.in, fh = face.h.in;
    const sc = Math.min(cw / fw, 96 / fh);
    const w = fw*sc, h = fh*sc;
    const X = PAD + i*(cw + gap) + (cw - w)/2, Y = 56;
    s.add("rect", {x:X, y:Y, width:w, height:h, fill:"var(--shell)",
                   "fill-opacity":.5, stroke:"var(--cut)", "stroke-width":1.2});
    s.add("rect", {x:X + f.u*sc, y:Y + f.v*sc, width:Math.max(f.w*sc, 3),
                   height:Math.max(f.h*sc, 3), fill:"var(--stitch)",
                   "fill-opacity":.3, stroke:"var(--stitch)",
                   "stroke-width":1.3, "stroke-dasharray":"4 3"});
    s.add("text", {x:X + w/2, y:Y - 8, "text-anchor":"middle",
                   "font-family":"var(--f-data)", "font-size":11,
                   fill:"var(--ink)"}, f.face);
    s.add("text", {x:PAD + i*(cw + gap) + cw/2, y:Y + h + 18, "text-anchor":"middle",
                   "font-family":"var(--f-data)", "font-size":10,
                   fill:"var(--muted)"}, (f.design || "").slice(0, 22));
  });
  s.add("text", {x:PAD, y:196, "font-family":"var(--f-data)", "font-size":11,
                 fill:"var(--muted)"},
        "each is a separate hooping, and every one of these pieces is cut "
        + "OVERSIZED and trimmed to size afterwards");
  return s;
}

/* --- the zipper panel, across its width ------------------------------ */

    + `the coil ${g.coil_c.text} from the cut edge, finishing ${g.gusset_w.text} wide.`);
  caption(s, PAD, 24, "SECTION ACROSS THE ZIPPER PANEL");

  dim1(s, PAD + (sf+coil)*S, 74, PAD + (sf+sr+coil)*S, g.strip_rear.text, "var(--stitch)");
  dim1(s, PAD, y+hh+88, PAD + sf*S + coil*S/2, `${g.coil_c.text} to the coil centre`, "var(--coil)");
  dim1(s, PAD, y+hh+118, PAD + (sf+sr)*S - 2*lap*S + coil*S,

/* --- a face, in plan, with its features ------------------------------- */
const FEAT_FILL = {zip:"var(--coil)", placket:"var(--web)", pocket:"var(--shell-lit)",
                   "belt-loop":"var(--web)", dring:"var(--metal)", logo:"var(--stitch)",
                   rib:"var(--web)", webbing:"var(--web)"};
function figFace(p, spec){
  const name = spec.face, m = p.model3d, f = m.faces[name];
  if (!f) return null;
  const fw = f.w.in, fh = f.h.in, fl = m.flange.in, show = m.binding_show.in,
        R = (m.corner_radius || {in:0}).in;
  const W = 660, PAD = 54, S = Math.min((W - 2*PAD) / fw, 300 / fh);
  const w = fw*S, h = fh*S, X = (W - w)/2, Y = 46;
  const hi = spec.highlight;
  const s = fig(`0 0 ${W} ${h + 116}`,
    `The ${name} face in plan, ${f.w.text} by ${f.h.text}`
    + (hi ? `, with the ${hi} highlighted` : "") + ".");
  caption(s, PAD, 22, `${name.toUpperCase()} FACE — LOOKING AT IT`);
  /* the panel, with the bottom corners rounded if this bag has them */
  const r = Math.min(R*S, w/2, h/2);
  const d = r > 0.5
    ? `M${X},${Y} h${w} v${h-r} a${r},${r} 0 0 1 ${-r},${r} h${-(w-2*r)} a${r},${r} 0 0 1 ${-r},${-r} Z`
    : `M${X},${Y} h${w} v${h} h${-w} Z`;
  s.add("path", {d, fill:"var(--shell)", "fill-opacity":.55,
                 stroke:"var(--cut)", "stroke-width":1.4});
  /* the binding band round the outside, and the stitch line inside it */
  s.add("path", {d, fill:"none", stroke:"var(--binding)",
                 "stroke-width":Math.max(show*S, 3), opacity:.55});
  s.add("rect", {x:X+fl*S, y:Y+fl*S, width:w-2*fl*S, height:h-2*fl*S, fill:"none",
                 stroke:"var(--stitch)", "stroke-width":1, "stroke-dasharray":"6 4"});
  /* features that live on this face */
  (m.features || []).filter(ft => ft.face === name).forEach(ft => {
    const on = !hi || ft.kind === hi;
    const o = on ? 1 : .18;
    /* A feature declares only the axes it is ACTUALLY placed on. A divider rib
       gives u and w and no v/h at all, because it is a line running the full
       height -- read that as undefined and the whole figure renders as NaN and
       disappears silently. Absent along an axis means "the whole of it". */
    const fu = ft.u == null ? 0 : ft.u, fv = ft.v == null ? 0 : ft.v;
    const fwIn = ft.w == null ? fw - fu : ft.w;
    const fhIn = ft.h == null ? fh - fv : ft.h;
    const fx = X + fu*S, fy = Y + fv*S;
    if (ft.kind === "dring"){
      s.add("circle", {cx:fx, cy:fy, r:7, fill:"none", stroke:FEAT_FILL.dring,
                       "stroke-width":3.4, opacity:o});
    } else {
      const fwp = Math.max(fwIn*S, 3), fhp = Math.max(fhIn*S, 3);
      s.add("rect", {x:fx, y:fy, width:fwp, height:fhp,
                     fill:FEAT_FILL[ft.kind] || "var(--muted)",
                     "fill-opacity": ft.kind === "logo" ? .22 : .8,
                     stroke:FEAT_FILL[ft.kind] || "var(--muted)",
                     "stroke-width": on ? 1.6 : 1,
                     "stroke-dasharray": ft.kind === "logo" ? "5 3" : null,
                     opacity:o});
    }
    if (on){
      const ly = fy + (ft.kind === "dring" ? -13 : -6);
      s.add("text", {x:fx, y:ly, "font-family":"var(--f-data)", "font-size":10.5,
                     fill:"var(--ink)"}, (ft.label || ft.kind).split("—")[0].trim());
    }
  });
  /* The belt, drawn through the keepers -- "thread your belt" and "sew the
     keepers" are different steps and were the same picture. */
  if (spec.belt){
    const loops = (m.features || []).filter(ft => ft.face === name
                                            && ft.kind === "belt-loop");
    if (loops.length){
      const by = Y + (loops[0].v + (loops[0].h || 1)/2)*S;
      const bh = Math.max((p.geometry.belt ? p.geometry.belt.in : 1)*S, 10);
      s.add("rect", {x:X - 26, y:by - bh/2, width:w + 52, height:bh,
                     fill:"var(--web)", "fill-opacity":.75,
                     stroke:"var(--web)", "stroke-width":1.4});
      s.add("text", {x:X + w + 30, y:by - bh/2 - 8, "text-anchor":"end",
                     "font-family":"var(--f-data)", "font-size":11,
                     fill:"var(--web)"},
            `your ${p.geometry.belt ? p.geometry.belt.text : ""} belt, threaded`);
      loops.forEach(ft => s.add("rect", {x:X + ft.u*S, y:Y + ft.v*S,
                     width:(ft.w||0)*S, height:(ft.h||0)*S, fill:"none",
                     stroke:"var(--stitch)", "stroke-width":2}));
    }
  }
  dim1(s, X, Y+h+34, X+w, `${f.w.text} overall`, "var(--cut)");
  dim1(s, X+fl*S, Y+h+62, X+w-fl*S,
       `${p.geometry["face_" + (name === "left" || name === "right" ? "d" : "w")].text} stitch line`,
       "var(--stitch)");
  vdim(s, X-24, Y, Y+h, f.h.text, "var(--cut)");
  return s;
}

/* --- the three pieces of a pocketed panel, with real widths ----------- */
function figPocketPieces(p, spec){
  const g = p.geometry, ax = spec.axis === "side" ? "side" : "top";
  /* The two pieces are called upper/lower when the panel splits ACROSS and
     near/far when it splits DOWN, in the geometry as well as in the prose.
     Reading "upper" off a side split returns undefined, the figure throws,
     buildFigure swallows it, and the step simply shows no drawing. */
  const A = ax === "top" ? ["top_upper", "top_lower"] : ["side_near", "side_far"];
  const K = k => g[(ax === "top" ? "top_" : "side_") + k];
  if (!K("zip") || !g[A[0]] || !g[A[1]]) return null;
  const up = g[A[0]].in, lo = g[A[1]].in, coil = g.coil.in,
        lap = g.lap.in, span = K("across").in;
  const W = 660, PAD = 40, S = (W - 2*PAD) / (up + lo);
  const s = fig(`0 0 ${W} 250`,
    `The outer layer of the pocketed panel, split into ${g[A[0]].text} and `
    + `${g[A[1]].text}, each lapping ${g.lap.text} onto the tape and adding `
    + `back to ${K("across").text}.`);
  caption(s, PAD, 22, ax === "top" ? "OUTER LAYER — SPLIT ACROSS" : "OUTER LAYER — SPLIT DOWN");
  const y = 60, hh = 34;
  s.add("rect", {x:PAD, y, width:up*S, height:hh, fill:"var(--shell)"});
  s.add("rect", {x:PAD + (up+coil)*S, y, width:lo*S, height:hh, fill:"var(--shell)"});
  s.add("rect", {x:PAD + up*S, y:y-6, width:coil*S, height:hh+6, fill:"var(--coil)"});
  [[PAD+(up-lap)*S, up*S ? PAD+up*S : 0], [PAD+(up+coil)*S, PAD+(up+coil+lap)*S]]
    .forEach(([a,b]) => s.add("rect", {x:a, y:y-4, width:b-a, height:hh+8,
                                       fill:"var(--cut)", opacity:.18}));
  dim1(s, PAD, y-16, PAD+up*S, g[A[0]].text, "var(--stitch)");
  dim1(s, PAD+(up+coil)*S, y-16, PAD+(up+lo+coil)*S, g[A[1]].text, "var(--stitch)");
  /* the identity, drawn */
  const iy = y + hh + 44;
  s.add("rect", {x:PAD, y:iy, width:(up+lo+coil-2*lap)*S, height:20,
                 fill:"var(--good)", opacity:.2, stroke:"var(--good)"});
  s.add("text", {x:PAD+6, y:iy+15, "font-family":"var(--f-data)", "font-size":11.5,
                 fill:"var(--good)"},
        `(${g[A[0]].text} − ${g.lap.text}) + ${g.coil.text} + (${g[A[1]].text} − `
        + `${g.lap.text}) = ${K("across").text}, the panel it replaces`);
  s.add("text", {x:PAD, y:iy+52, "font-family":"var(--f-data)", "font-size":11,
                 fill:"var(--muted)"},
        "the INNER layer is the full panel, uncut — the pocket is the cavity between them");
  s.add("text", {x:PAD, y:iy+72, "font-family":"var(--f-data)", "font-size":11,
                 fill:"var(--muted)"}, "nothing is cut open, and no load crosses the zip");
  return s;
}

  s.add("text", {x:30, y:236, "font-family":"var(--f-data)", "font-size":11,
                 fill:"var(--muted)"},

/* --- dispatcher -------------------------------------------------------- */
const FIG_KINDS = {ring:figRing, "zip-panel":figZipPanel, face:figFace,
                   "pocket-pieces":figPocketPieces, seam:figSeam,
                   anchors:figAnchors, logos:figLogos};
function buildFigure(spec, p){
  try {
    if (spec.doc){
      /* Pull the drawing out of the technique note that owns it. One copy,
         one file -- embedding a duplicate here is how two drawings of the
         same thing end up disagreeing. */
      const src = LIB.docs[spec.doc];
      if (!src) return null;
      const i = src.indexOf(`<svg id="${spec.id}"`);
      if (i < 0) return null;
      const j = src.indexOf("</svg>", i);
      if (j < 0) return null;
      const holder = document.createElement("div");
      holder.innerHTML = src.slice(i, j + 6);
      return holder.firstElementChild;
    }
    const fn = FIG_KINDS[spec.kind];
    return fn ? fn(p, spec) : null;
  } catch (e){ return null; }
}

function cards(items, kind, docs){
  const box = el("div", "cards");
  items.forEach(n => {
    const c = el("div", "card");
    const k = el("div", "kick k-" + (kind || n.kind || "note"));
    k.textContent = n.kickText || (kind === "open" ? "Open" : (n.kind || "note"));
    if (n.stepNo !== undefined){ k.textContent = ""; k.appendChild(el("b", null, String(n.stepNo))); }
    c.appendChild(k);
    const b = el("div");
    b.appendChild(el("h3", null, n.title));
    if (n.body){
      /* One paragraph per blank line, and the first use of each glossary term
         becomes a link. A table of definitions nobody opens is prose. */
      String(n.body).split("\n\n").forEach(par => {
        const p = el("p");
        p.appendChild(kind === "step" ? glossed(par) : document.createTextNode(par));
        b.appendChild(p);
      });
    }
    if (n.stitch) b.appendChild(el("div", "stitchnote", "▸ " + n.stitch));
    /* Figures come before the technique links: a drawing of what this step
       means is worth more than a button offering one. */
    (n.figures || []).forEach(spec => {
      const g = buildFigure(spec, LIB.patterns[current]);
      if (!g) return;
      const f = el("figure", "stepfig");
      f.appendChild(g);
      if (spec.caption) f.appendChild(el("figcaption", null, spec.caption));
      b.appendChild(f);
    });
    /* A step that needs a method rather than a number links to the technique
       note that teaches it, instead of re-explaining it badly in eighty words. */
    (n.see || []).forEach(path => {
      const doc = (docs || []).find(d => d.path === path);
      if (!doc) return;
      const btn = el("button", "seebtn", "◆  " + doc.title);
      btn.onclick = () => openDoc(doc);
      b.appendChild(btn);
    });
    c.appendChild(b); box.appendChild(c);
  });
  return box;
}
function nestSvg(lay){
  const roll = lay.roll_width_in, used = Math.max(lay.used.in, 1);
  const S = 720 / roll, h = used * S;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `-4 -18 ${roll*S + 8} ${h + 26}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `Nesting layout for ${lay.material}`);
  const add = (tag, at, txt) => { const n = document.createElementNS(ns, tag);
    for (const k in at) n.setAttribute(k, at[k]); if (txt != null) n.textContent = txt;
    svg.appendChild(n); return n; };
  add("rect", {x:0, y:0, width:roll*S, height:h, fill:"none",
               stroke:"var(--muted)", "stroke-dasharray":"6 4"});
  lay.pieces.forEach(p => {
    /* A piece with rounded corners is not a rectangle, and a cutting layout
       that draws it as one is a layout you cut wrong. Nested pieces are laid
       long edge along the roll, so the curve is on whichever pair of corners
       the short dimension puts at the bottom -- draw it on both ends of the
       long edge, which is what the piece actually looks like. */
    const R = Math.min((p.r || 0) * S, p.w*S/2, p.h*S/2);
    const X = p.x*S, Y = p.y*S, Wp = p.w*S, Hp = p.h*S;
    if (R > 0.5){
      add("path", {d:`M${X},${Y} h${Wp} v${Hp-R} a${R},${R} 0 0 1 ${-R},${R} `
                    + `h${-(Wp-2*R)} a${R},${R} 0 0 1 ${-R},${-R} Z`,
                   fill:"var(--shell)", "fill-opacity":".14",
                   stroke:"var(--cut)", "stroke-width":"1.4"});
    } else {
      add("rect", {x:X, y:Y, width:Wp, height:Hp,
                   fill:"var(--shell)", "fill-opacity":".14",
                   stroke:"var(--cut)", "stroke-width":"1.4"});
    }
    add("text", {x:p.x*S + 5, y:p.y*S + 13, fill:"var(--ink)",
                 "font-size":"10", "font-family":"var(--f-label)"}, p.piece);
    add("text", {x:p.x*S + 5, y:p.y*S + 25, fill:"var(--muted)",
                 "font-size":"9.5", "font-family":"var(--f-data)"},
        `${p.w.toFixed(2)} × ${p.h.toFixed(2)}`);
  });
  add("text", {x:roll*S/2, y:-6, "text-anchor":"middle", fill:"var(--muted)",
               "font-size":"11", "font-family":"var(--f-data)"},
      `${roll}" roll width — ${lay.used.text} consumed`);
  return svg;
}

function panelFor(name, p){
  const d = el("div", "panel");
  if (name === "Glossary"){
    const terms = LIB.glossary || [];
    d.appendChild(el("p", "lede",
      "Every word the patterns use as if you already knew it. These are linked "
      + "from the first place each one appears in the assembly steps, so you "
      + "should rarely need this page — it is here for when you do."));
    /* Grouped by what you are DOING when you meet the word, not
       alphabetically: "which foot" and "which stitch" are different questions
       and an A-Z interleaves them. */
    const GROUPS = ["geometry", "parts", "joins", "stitches", "shaping",
                    "zippers", "materials", "tools", "embroidery", "hardware",
                    "faults"];
    const byGroup = new Map();
    terms.forEach(t => {
      if (!byGroup.has(t.group)) byGroup.set(t.group, []);
      byGroup.get(t.group).push(t);
    });
    const order = GROUPS.filter(g => byGroup.has(g))
      .concat([...byGroup.keys()].filter(g => !GROUPS.includes(g)));
    order.forEach(g => {
      d.appendChild(el("h2", null, g[0].toUpperCase() + g.slice(1)));
      d.appendChild(tableOf(["Term", "What it means"],
        byGroup.get(g).map(t => {
          const b = el("button", "term", t.term);
          b.onclick = () => openTerm(t);
          const cell = el("span");
          cell.appendChild(b);
          if ((t.aka || []).length)
            cell.appendChild(el("span", "termaka", "  " + t.aka.join(", ")));
          return [{node: cell}, {t: t.short, cls: "sub"}];
        })));
    });
    return d;
  }
  if (name === "Overview"){
    d.appendChild(el("p", "lede", p.description));
    if (p.open_questions.length){
      d.appendChild(el("h2", null, "Before you cut — open questions"));
      d.appendChild(cards(p.open_questions.map(q => ({...q, kickText:"Open"})), "open"));
    }
    if (p.notes.length){
      d.appendChild(el("h2", null, "Notes worth keeping"));
      d.appendChild(cards(p.notes));
    }
    d.appendChild(el("h2", null, "Geometry"));
    d.appendChild(el("p", null, p.summary));
    d.appendChild(tableOf(["Measure", "Figure"], [
      ["Finished overall", {t:`${p.finished.w.text} W × ${p.finished.d.text} D × ${p.finished.h.text} H`, cls:"d"}],
      [" …the bound rib eats", {t:`${p.geometry.flange.text} off every edge (${p.geometry.sa.text} allowance + ${p.geometry.turn.text} binding turn), and it points OUTWARD`, cls:"d"}],
      [" …leaving a stitch-line box", {t:`${p.geometry.face_w.text} × ${p.geometry.face_d.text} × ${p.geometry.face_h.text}`, cls:"d"}],
      [" …and visible cloth", {t:`${p.geometry.visible_w.text} × ${p.geometry.visible_h.text} between the bindings — size artwork to this`, cls:"d"}],
      ["Interior", {t:`${p.interior.w.text} × ${p.interior.h.text} × ${p.interior.d.text} — ${p.interior.litres} L`, cls:"d"}],
      ["Panel cut", {t:`${p.geometry.panel_w.text} × ${p.geometry.panel_h.text} — the finished size LESS two ${p.geometry.turn.text} turns, not plus two allowances`, cls:"d"}],
      ["Gusset cut width", {t:p.geometry.gusset_w.text, cls:"d"}],
      ["Ring at the stitch line", {t:p.geometry.ring.text, cls:"d"}],
      ["Seam allowance / flange", {t:`${p.geometry.sa.text} / ${p.geometry.flange.text}`, cls:"d"}],
      ["Binding shows, each face", {t:p.geometry.show.text, cls:"d"}]

    if (p.docs.filter(x => x.kind === "pattern").length){
      d.appendChild(el("h2", null, "Long-form notes"));
      const ul = el("ul", "helplist");
      p.docs.filter(x => x.kind === "pattern").forEach(doc => {
        const li = el("li"), b = el("button", "helpbtn");
        b.appendChild(document.createTextNode(doc.title));
        b.appendChild(el("em", null, doc.path));

      d.appendChild(ul);

  }
  if (name === "Comfort"){
    d.appendChild(el("p", "lede",
      "Figures from the load-carriage literature and from published testing. "
      + "None of them is a gate: the threshold that matters — 16 kPa, where "
      + "contact pressure starts to occlude blood flow — depends on how hard the "
      + "wearer cinches the belt, and nobody here has measured that. What can be "
      + "stated without inventing a number is the tension at which a belt of this "
      + "width reaches it."));
    if ((p.zipper_schedule || []).length){
      d.appendChild(el("h2", null, "Zipper schedule"));
      d.appendChild(el("p", null,
        "Every zipper on this bag, in the order it has to be built. "
        + "The technique note explains HOW to lap one; only this table knows how "
        + "long THIS one is, and all three lengths move whenever the bag is "
        + "resized. Chain is the span plus 1″ — half an inch of tape past each "
        + "new stop, so the stop has cloth behind it and the cut end can be capped."));
      d.appendChild(tableOf(["Zip", "Opening", "Cut chain", "Buy", "Sliders", "Stops", "How it goes in"],
        p.zipper_schedule.map(r => [r.zip, {t:r.span, cls:"d"}, {t:r.chain, cls:"d"},
                                    {t:r.buy, cls:"d"}, {t:String(r.sliders), cls:"d"},
                                    {t:r.stops, cls:"sub"}, {t:r.note, cls:"sub"}])));
    }
    if ((p.assembly_load || []).length){
      d.appendChild(el("h2", null, "What it costs to sew"));
      d.appendChild(el("p", null,
        "Ease of assembly was the one goal with no number behind it, so every "
        + "decision that added a seam got judged on the feature it bought and never "
        + "on the seam. Counted, in roughly the order they hurt."));
      d.appendChild(tableOf(["Operation", "Count", "Why it costs"],
        p.assembly_load.map(r => [r.item, {t:String(r.count), cls:"d"},
                                  {t:r.note, cls:"sub"}])));
    }
    d.appendChild(el("h2", null, "Reported figures"));
    const box = el("div", "cards");
    (p.comfort || []).forEach(c => {
      const card = el("div", "card");
      const k = el("div", "kick k-note");
      k.textContent = "";
      k.appendChild(el("b", null, ""));
      card.appendChild(k);
      const b = el("div");
      const h = el("h3");
      h.appendChild(document.createTextNode(c.measure + " — "));
      const v = el("span"); v.style.fontFamily = "var(--f-data)";
      v.style.color = "var(--stitch)"; v.textContent = c.value;
      h.appendChild(v);
      b.appendChild(h);
      b.appendChild(el("p", null, c.basis));
      card.appendChild(b); box.appendChild(card);
    });
    d.appendChild(box);
    if ((p.sources || []).length){
      d.appendChild(el("h2", null, "Where these come from"));
      d.appendChild(el("p", null,
        "Nothing in this repository has been worn by anybody. The same caveat "
        + "docs/16 carries about its webbing parameters applies here: these are "
        + "starting points for a first build, not settled numbers."));
      const ul = el("ul", "helplist");
      p.sources.forEach(s => {
        const li = el("li");
        const a = el("a", "helpbtn");
        a.href = s.url; a.target = "_blank"; a.rel = "noopener";
        a.style.display = "block"; a.style.textDecoration = "none";
        a.appendChild(document.createTextNode(s.title));
        a.appendChild(el("em", null, s.gives));
        li.appendChild(a); ul.appendChild(li);
      });
      d.appendChild(ul);
    }
  }
  if (name === "Materials"){
    d.appendChild(el("h2", null, "Materials"));
    d.appendChild(tableOf(["Role", "Material", "Thickness", "Frays", "Note"],
      p.materials.map(m => [m.role, m.material,
        {t: m.thickness_mm != null ? m.thickness_mm.toFixed(2) + " mm" : "", cls:"d"},
        {t: m.frays === undefined ? "" : (m.frays ? "yes" : "no"), cls:"d"},
        {t: m.note || "", cls:"sub"}])));
    d.appendChild(el("h2", null, "Buy this"));
    d.appendChild(tableOf(["Item", "Quantity", "Note"],
      p.takeoff.map(t => [t.item, {t:t.qty, cls:"d"}, {t:t.note, cls:"sub"}])));
    d.appendChild(el("h2", null, "Thickness budget"));
    d.appendChild(el("p", null,
      "Derived from the material table, not copied from any document. Peak on this bag is "
      + p.peak_mm.toFixed(2) + " mm — hand-wheel anything over 5."));
    d.appendChild(tableOf(["Location", "Stack", "mm"],
      p.thickness.map(t => [t.location, {t:t.stack, cls:"sub"},
        {t:t.mm.toFixed(2), cls:"d"}])));
    d.appendChild(el("h2", null, "Tools"));
    d.appendChild(tableOf(["Tool", "Why"], p.tools.map(t => [t.tool, {t:t.why, cls:"sub"}])));
  }
  if (name === "Cut list"){
    d.appendChild(el("h2", null, "Cut list"));
    d.appendChild(el("p", null,
      "Derived from the finished envelope. Never hand-edit it — change the spec and regenerate."));
    d.appendChild(tableOf(["Piece", "Qty", "Cut size", "Corners", "Material", "Note"],
      p.cut_list.map(c => [c.piece, {t:String(c.qty), cls:"d"},
        {t:`${c.w.text} × ${c.l.text}`, cls:"d"},
        {t: c.corners === "square" ? "square"
            : `bottom R${c.corner_r.text}`,
         cls: c.corners === "square" ? "sub" : "d"},
        {t:c.material, cls:"d"}, {t:c.note, cls:"sub"}])));
    p.layouts.forEach(lay => {
      d.appendChild(el("h2", null, "Nesting — " + lay.material));
      const box = el("div", "nest");
      box.appendChild(nestSvg(lay));
      d.appendChild(box);
    });
    if (p.hardware.length){
      d.appendChild(el("h2", null, "Hardware"));
      d.appendChild(tableOf(["Item", "Qty", "Note"],
        p.hardware.map(h => [h.item, {t:String(h.qty), cls:"d"}, {t:h.note, cls:"sub"}])));
    }
  }
  if (name === "Assembly"){
    d.appendChild(el("h2", null, "Before cutting"));
    d.appendChild(tableOf(["Gate", "Why"],
      p.checklist.map(c => [c.item, {t:c.why, cls:"sub"}])));
    d.appendChild(el("h2", null, "Assembly order"));
    d.appendChild(el("p", null,
      "A bound seam cannot be unpicked — the holes stay. This order does all flat sewing first, "
      + "so nothing has to be reached into. Steps that do not apply to this bag are already gone."));
    d.appendChild(cards(p.assembly.map(s => ({...s, stepNo: s.n})), "step", p.docs));
    d.appendChild(el("h2", null, "Stitch schedule"));
    d.appendChild(tableOf(["Operation", "Stitch", "Length", "Foot", "Needle"],
      p.stitch_schedule.map(s => [s.operation, s.stitch,
        {t: s.length_mm + " mm", cls:"d"}, {t:s.foot, cls:"d"}, {t:s.needle, cls:"d"}])));
  }
  if (name === "Checks"){
    const bad = p.checks.filter(c => !c.ok).length;
    d.appendChild(el("p", "lede", bad
      ? bad + " check(s) failed. A failed check is the design telling you something — "
        + "both failures in this family so far were real, and neither wanted a fudge."
      : "Every check passes. They run against the derived geometry, not against anything typed in."));
    const box = el("div", "checks");
    p.checks.forEach(c => {
      const r = el("div", "chk " + (c.ok ? "ok" : "no"));
      r.appendChild(el("i", null, c.ok ? "✓" : "✕"));
      const b = el("div");
      b.appendChild(document.createTextNode(c.name));
      b.appendChild(el("span", null, c.detail));
      r.appendChild(b); box.appendChild(r);
    });
    d.appendChild(box);
  }
  return d;
}

/* ---------------- reader ------------------------------------------------- */
/* ---- the glossary ------------------------------------------------------
   A glossary nobody opens is prose with a table of contents. So the terms
   are DATA, and the first use of each one in a step body becomes a link to
   its entry -- which is the only version of a glossary anybody reads.
   Longest name first, so "reverse coil" wins over "coil".
------------------------------------------------------------------------ */
let GLOSS = null, GLOSS_RE = null;
function glossIndex(){
  if (GLOSS) return GLOSS;
  GLOSS = new Map();
  const names = [];
  (LIB.glossary || []).forEach(t => {
    [t.term].concat(t.aka || []).forEach(n => {
      GLOSS.set(n.toLowerCase(), t); names.push(n);
    });
  });
  names.sort((a, b) => b.length - a.length);
  const esc = s => s.replace(/[\.*+?^${}()|[\]\\]/g, "\\$&");
  /* Word boundaries on both ends, so "tack" does not fire inside
     "bar-tack" -- which is a separate entry and the one that should win. */
  GLOSS_RE = names.length
    ? new RegExp("\\b(" + names.map(esc).join("|") + ")\\b", "gi") : null;
  return GLOSS;
}
/* Turn a plain paragraph into nodes, linking the FIRST use of each term. */
function glossed(text){
  glossIndex();
  const frag = document.createDocumentFragment();
  if (!GLOSS_RE || !text){ frag.appendChild(document.createTextNode(text || "")); return frag; }
  const used = new Set();
  let last = 0, m;
  GLOSS_RE.lastIndex = 0;
  while ((m = GLOSS_RE.exec(text)) !== null){
    const key = m[1].toLowerCase(), entry = GLOSS.get(key);
    if (!entry || used.has(entry.term)){ continue; }
    used.add(entry.term);
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    const b = el("button", "term", m[1]);
    b.title = entry.short;
    b.onclick = e => { e.stopPropagation(); openTerm(entry); };
    frag.appendChild(b);
    last = m.index + m[1].length;
  }
  frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}
function openTerm(t){
  const body = $("#readerBody");
  $("#readerTitle").textContent = t.term;
  body.innerHTML = "";
  const kick = el("div", "kick k-technique", t.group);
  body.appendChild(kick);
  body.appendChild(el("p", "termshort", t.short));
  (t.aka || []).length && body.appendChild(
    el("div", "termaka", "also written: " + t.aka.join(", ")));
  /* [[cross refs]] jump to the other entry rather than dead-ending. */
  (t.body || "").split("\n\n").forEach(par => {
    const p = el("p");
    let last = 0, m;
    const re = /\[\[([^\]]+)\]\]/g;
    while ((m = re.exec(par)) !== null){
      p.appendChild(document.createTextNode(par.slice(last, m.index)));
      const other = glossIndex().get(m[1].toLowerCase());
      if (other){
        const b = el("button", "term", m[1]);
        b.onclick = () => openTerm(other);
        p.appendChild(b);
      } else p.appendChild(document.createTextNode(m[1]));
      last = m.index + m[0].length;
    }
    p.appendChild(document.createTextNode(par.slice(last)));
    body.appendChild(p);
  });
  if (t.see){
    const doc = (LIB.help || []).find(d => d.path === t.see);
    if (doc){
      const btn = el("button", "seebtn", "◆  " + doc.title);
      btn.onclick = () => openDoc(doc);
      body.appendChild(btn);
    }
  }
  /* Somebody else demonstrating it. The kind is shown because half of what a
     search turns up for these operations is a photo walkthrough on a page
     whose URL says "video" -- and the best box-X reference here IS stills. */
  if ((t.watch || []).length){
    body.appendChild(el("div", "lab watchlab", "Watch it done"));
    const ul = el("div", "watch");
    t.watch.forEach(w => {
      const a = el("a", "watchlink");
      a.href = w.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.appendChild(el("span", "kindtag k-" + w.kind, w.kind));
      a.appendChild(document.createTextNode(" " + w.title));
      ul.appendChild(a);
    });
    body.appendChild(ul);
  }
  $("#reader").hidden = false;
  $("#readerClose").focus();
}

function openDoc(doc){
  $("#readerTitle").textContent = doc.title + " — " + doc.path;
  $("#readerBody").innerHTML = markdown(LIB.docs[doc.path] || "*Not available.*");
  $("#reader").hidden = false;
  $("#readerClose").focus();
}
$("#readerClose").onclick = () => { $("#reader").hidden = true; };
$("#reader").addEventListener("click", e => { if (e.target.id === "reader") $("#reader").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#reader").hidden = true; });

/* ---------------- render ------------------------------------------------- */
let current = 0;
let activeTab = 0;

function renderHelp(p){
  const ul = $("#helplist"); ul.innerHTML = "";
  const seen = new Set();
  LIB.help.concat(p.docs).forEach(doc => {
    if (seen.has(doc.path)) return; seen.add(doc.path);
    const li = el("li"), b = el("button", "helpbtn");
    b.appendChild(document.createTextNode(doc.title));
    b.appendChild(el("em", null, doc.kind));
    b.onclick = () => openDoc(doc);
    li.appendChild(b); ul.appendChild(li);
  });
  $("#prov").innerHTML = "";
  $("#prov").appendChild(el("span", null, "Schema " + p.schema_version));
  /* Date AND time. The stamp is the only way to tell a stale page from a fresh
     one -- this file is opened straight off disk, so a browser will happily
     serve yesterday's copy -- and a date alone cannot separate two builds on
     the same day, which is every build during a working session. */
  $("#prov").appendChild(el("span", null, "Built "
    + p.provenance.generated_at.slice(0, 16).replace("T", " ") + " UTC"));
  $("#prov").appendChild(el("span", null, p.provenance.spec.path));
}

function render(){
  const p = LIB.patterns[current];
  document.title = p.title + " — Pattern Player";

  const bad = p.checks.filter(c => !c.ok).length;
  const stats = $("#stats"); stats.innerHTML = "";
  [["Finished", `${p.finished.w.text} W × ${p.finished.d.text} D × ${p.finished.h.text} H`],
   ["Metric", `${p.finished.w_mm} × ${p.finished.d_mm} × ${p.finished.h_mm} mm`],
   ["Capacity", p.interior.litres + " L"],
   ["Ring", p.geometry.ring.text],
   ["Shell", p.materials[0].material],
   ["Peak stack", p.peak_mm.toFixed(2) + " mm"],
   ["Checks", bad ? bad + " failed" : "all pass"]
  ].forEach(([k, v]) => {
    const s = el("div", "stat");
    s.appendChild(el("span", "lab", k));
    s.appendChild(el("b", null, v));
    stats.appendChild(s);
  });

  const fl = $("#flags"); fl.innerHTML = "";
  if (p.open_questions.length){
    fl.appendChild(el("span", "chip warn",
      p.open_questions.length + " open question" + (p.open_questions.length > 1 ? "s" : "")));
  }
  Object.entries(p.flags).forEach(([k, v]) => {
    if (!v) return;
    fl.appendChild(el("span", "chip on", k.replace(/_/g, " ")));
  });

  build(p);
  apply();

  const lg = $("#legend"); lg.innerHTML = "";
  const items = [["var(--binding)", "binding, " + p.model3d.binding_show.text + " each face"],
                 ["var(--coil)", "zip coil, " + p.geometry.coil_c.text + " from the cut edge"]];
  if (p.flags.has_chassis) items.push(["var(--web)", p.geometry.loop.text + " chassis, inside the gusset"]);
  if (p.flags.has_drings) items.push(["var(--metal)", "D-rings on external tabs"]);
  items.push(["var(--stitch)", "embroidery field"]);
  items.forEach(([c, t]) => {
    const s = el("span", "lg"); const sw = el("span", "sw"); sw.style.background = c;
    s.appendChild(sw); s.appendChild(document.createTextNode(t)); lg.appendChild(s);
  });

  const tabs = $("#tabs"); tabs.innerHTML = "";
  const panels = $("#panels"); panels.innerHTML = "";
  TABS.forEach((name, i) => {
    const b = el("button", "tab", name);
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(i === activeTab));
    b.onclick = () => { activeTab = i; render(); };
    tabs.appendChild(b);
    const pane = panelFor(name, p);
    pane.hidden = i !== activeTab;
    panels.appendChild(pane);
  });

  renderHelp(p);
}

const pick = $("#pick");
LIB.patterns.forEach((p, i) => {
  const o = el("option", null, p.title);
  o.value = String(i); pick.appendChild(o);
});
pick.addEventListener("change", e => { current = +e.target.value; activeTab = 0; render(); });
let rz = 0;
window.addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => { build(LIB.patterns[current]); apply(); }, 120);
});
render();
})();
</script>
